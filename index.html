/*<<SATOFINDER-SCRIPT-BEGIN>>*/
'use strict';

// ====================== 03. CONSTANTS ======================
const VERSION = '2.5.0';

// WhatsOnChain and Bitails paging, used by ENDPOINTS below (so defined before it).
const WOC_UTXO_PAGE = 1000;
const WOC_UTXO_MAX_PAGES = 50;
const BITAILS_BATCH = 20;       // per-request address count
const BITAILS_PAGE = 1000;      // UTXOs per address per request
const BITAILS_MAX_PAGES = 50;   // beyond this an address's scan is incomplete: fail
const ENDPOINTS = Object.freeze({
  woc: {
    balance:  (a) => `https://api.whatsonchain.com/v1/bsv/main/address/${encodeURIComponent(a)}/balance`,
    // The documented, paged UTXO listing (the older /unspent is no longer in
    // WhatsOnChain's docs); Net.woc.unspent follows nextPageToken to the end.
    unspentAll: (a, token) => `https://api.whatsonchain.com/v1/bsv/main/address/${encodeURIComponent(a)}/unspent/all?limit=${WOC_UTXO_PAGE}`
                + (token ? `&token=${encodeURIComponent(token)}` : ''),
    history:  (a) => `https://api.whatsonchain.com/v1/bsv/main/address/${encodeURIComponent(a)}/history`,
    txInfo:   (h) => `https://api.whatsonchain.com/v1/bsv/main/tx/hash/${encodeURIComponent(h)}`,
    broadcast: 'https://api.whatsonchain.com/v1/bsv/main/tx/raw',
    price:     'https://api.whatsonchain.com/v1/bsv/main/exchangerate',
  },
  bitails: {
    // Paged per address: `from` is an item offset, `limit` the page size.
    // The default page size is undocumented, so Recovery.scan asks for one and
    // pages every address that has UTXOs until a page comes back empty.
    unspentMulti: `https://api.bitails.io/address/unspent/multi?from=0&limit=${BITAILS_PAGE}`,
    unspent:      (a, from) => `https://api.bitails.io/address/${encodeURIComponent(a)}/unspent?from=${from}&limit=${BITAILS_PAGE}`,
    historyMulti: 'https://api.bitails.io/address/history/multi',
  },
  // GorillaPool's 1Sat overlay (the per-address REST surface; distinct from
  // junglebus.gorillapool.io which is the subscription firehose). The /txos
  // endpoint classifies each output with origin.data.insc (inscription /
  // ordinal), origin.data.bsv20 (BSV-20 token), or origin.data.lock — any of
  // those three flags a UTXO that we MUST NOT spend as a plain sat or we
  // could burn an NFT / destroy a token. Hard-block on unavailability is the
  // safe default in Tokens.fetchProtected().
  gorillapool: {
    // Paged: the endpoint defaults to 100 rows and to non-BSV-20 outputs only;
    // `bsv20=true` returns the BSV-20 outputs instead. Tokens.protectedSet()
    // walks both, every page.
    unspent:       (a, offset = 0, bsv20 = false) =>
                     `https://ordinals.gorillapool.io/api/txos/address/${encodeURIComponent(a)}/unspent` +
                     `?limit=${ORDINALS_PAGE}&offset=${offset}` + (bsv20 ? '&bsv20=true' : ''),
    bsv20Balance:  (a) => `https://ordinals.gorillapool.io/api/bsv20/${encodeURIComponent(a)}/balance`,
  },
});

// BIP path presets, mapped from the legacy walletType dropdown.
const PRESETS = Object.freeze({
  'default':     { bip: 44, coin: 0,   account: 0, label: 'Default BIP44 (m/44\'/0\'/0\'/0/i)' },
  'bip32basic':  { bip: 32, label: 'BIP32 basic (m/0\'/0\'/i)' },
  'atomic':      { bip: 44, coin: 145, account: 0, label: 'Atomic Wallet' },
  'exodus':      { bip: 44, coin: 236, account: 0, label: 'Exodus' },
  'keevo':       { bip: 44, coin: 236, account: 0, label: 'Keevo' },
  'moneybutton': { bip: 44, coin: 0,   account: 0, label: 'MoneyButton' },
  'relayx':      { bip: 44, coin: 236, account: 0, label: 'RelayX' },
  'simplycash':  { bip: 44, coin: 145, account: 0, label: 'SimplyCash' },
  'twetch':      { bip: 44, coin: 0,   account: 0, label: 'Twetch' },
});

const DEFAULT_FEE_PER_KB = 100; // sat/KB. User-adjustable (Prefs.feePerKb) so a
                                // network fee-floor change needs no redeploy.
const MAX_FEE_PER_KB = 100000;  // sanity ceiling on user input (0.001 BSV/KB)
const PBKDF2_ITER = 600000;     // OWASP 2023 recommendation for PBKDF2-SHA256 (new vaults)
const PBKDF2_ITER_LEGACY = 310000;  // what a vault without a recorded count was saved with
const AUTOLOCK_MS = 10 * 60 * 1000;
// A hidden tab locks after this grace period rather than at once. Locking
// discards any built transaction, and checking its raw hex on WhatsOnChain
// (as the confirm screens suggest) means switching tabs.
const HIDDEN_GRACE_MS = 60 * 1000;
const BACKUP_CHECK_WORDS = 3;   // words asked for when confirming a new phrase is written down
// A copied secret (key, phrase, passphrase) is cleared from the clipboard
// after this long, or at lock if sooner.
const CLIPBOARD_CLEAR_MS = 60 * 1000;
const RECOVERY_DEPTH = 50;      // default addresses scanned per branch (receive + change)
const RECOVERY_DEPTHS = [50, 100, 200, 500];   // choices offered for a deeper scan
const ORDINALS_PAGE = 1000;     // GorillaPool rows per page (it caps at 1000)
const ORDINALS_MAX_PAGES = 50;  // beyond this the scan is incomplete: refuse to spend
const VAULT_KEY = 'satofinder.vault.v1';
// Limits for a backup file being restored. A real one is about 1 KB; the
// iteration bounds keep a crafted file from forcing a weak or an endless KDF.
const BACKUP_MAX_BYTES = 64 * 1024;
const BACKUP_MIN_ITER = 100000;
const BACKUP_MAX_ITER = 10000000;
const PREFS_KEY = 'satofinder.prefs.v1';
const TIPPING_ADDRESS = '139Gv2y2JcjCNdnJNS3kWGm36mjjespfQc';

// External inspector for a built-but-unbroadcast tx. WhatsOnChain's broadcast
// page also has a "Decode" mode that parses raw hex without sending — the
// user can paste the hex there to verify inputs, outputs, addresses, and fee
// against their expectation before flipping back here to confirm.
const WOC_INSPECT_URL = 'https://whatsonchain.com/broadcast';

// ====================== 04. CRYPTO ======================
// WebCrypto-only vault: PBKDF2-SHA256(password, salt) -> AES-GCM key, encrypt
// JSON blob (mnemonic + createdAt). Nothing else is persisted. Derivation prefs
// live in a separate non-encrypted PREFS_KEY because they're not sensitive.
const Crypto = {
  randomBytes(n) { return crypto.getRandomValues(new Uint8Array(n)); },

  async deriveKey(password, salt, iter = PBKDF2_ITER) {
    const base = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt','decrypt']);
  },

  b64enc(buf) {
    const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]);
    return btoa(s);
  },
  b64dec(s) {
    const bin = atob(s); const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  },

  async encrypt(password, plaintextStr) {
    const salt = Crypto.randomBytes(16);
    const iv   = Crypto.randomBytes(12);
    const key  = await Crypto.deriveKey(password, salt);
    const ct   = await crypto.subtle.encrypt(
      { name: 'AES-GCM', iv }, key, new TextEncoder().encode(plaintextStr));
    return {
      v: 1, kdf: 'PBKDF2-SHA256', iter: PBKDF2_ITER,
      salt: Crypto.b64enc(salt),
      iv:   Crypto.b64enc(iv),
      ct:   Crypto.b64enc(ct),
    };
  },

  async decrypt(password, blob) {
    if (!blob || blob.v !== 1) throw new Error('Unsupported vault format');
    const salt = Crypto.b64dec(blob.salt);
    const iv   = Crypto.b64dec(blob.iv);
    const ct   = Crypto.b64dec(blob.ct);
    const key  = await Crypto.deriveKey(password, salt, blob.iter || PBKDF2_ITER_LEGACY);
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    } catch {
      throw new Error('Wrong password');
    }
    return new TextDecoder().decode(plain);
  },
};

// Vault persistence — single localStorage key, no plaintext anywhere.
// Payload (v1) is JSON: { mnemonic, passphrase, createdAt }. The BIP39
// passphrase ("25th word") is part of the seed material — it MUST live in the
// encrypted blob alongside the mnemonic, or unlock would derive the wrong
// wallet. Pre-2.1 vaults are missing the `passphrase` key and default to ''.
const Vault = {
  exists() {
    try { return localStorage.getItem(VAULT_KEY) !== null; } catch { return false; }
  },
  read() {
    try { return JSON.parse(localStorage.getItem(VAULT_KEY)); } catch { return null; }
  },
  // seal() does the slow encryption and writes nothing; commit() writes
  // synchronously. Callers that can be cancelled seal first, re-check that
  // nothing changed meanwhile, and only then commit.
  async seal(mnemonic, password, passphrase = '') {
    const payload = JSON.stringify({ mnemonic, passphrase, createdAt: Date.now() });
    return Crypto.encrypt(password, payload);
  },
  commit(blob) {
    localStorage.setItem(VAULT_KEY, JSON.stringify(blob));
  },
  async save(mnemonic, password, passphrase = '') {
    Vault.commit(await Vault.seal(mnemonic, password, passphrase));
  },
  async unlock(password) {
    const blob = Vault.read();
    if (!blob) throw new Error('No vault on this device');
    const json = await Crypto.decrypt(password, blob);
    const obj = JSON.parse(json);
    if (!obj.mnemonic || typeof obj.mnemonic !== 'string') throw new Error('Vault payload corrupt');
    // Older (pre-2.1) vaults are missing the passphrase field — default to ''.
    return { mnemonic: obj.mnemonic, passphrase: typeof obj.passphrase === 'string' ? obj.passphrase : '' };
  },
  raw() {
    try { return localStorage.getItem(VAULT_KEY); } catch { return null; }
  },
  // Re-encrypt a vault saved with fewer than PBKDF2_ITER iterations, keeping
  // its exact contents. rawBefore is the stored text the caller unlocked; the
  // new blob is written only if it decrypts back to the same plaintext and
  // the stored vault is still that text (not wiped or replaced meanwhile).
  // Returns true if it upgraded. Any failure leaves the old vault in place.
  async upgradeIfNeeded(password, rawBefore) {
    let old;
    try { old = JSON.parse(rawBefore); } catch { return false; }
    if (!old || !Number.isInteger(old.iter) || old.iter >= PBKDF2_ITER) return false;
    const plaintext = await Crypto.decrypt(password, old);
    const fresh = await Crypto.encrypt(password, plaintext);
    if (await Crypto.decrypt(password, fresh) !== plaintext) return false;
    if (Vault.raw() !== rawBefore) return false;
    localStorage.setItem(VAULT_KEY, JSON.stringify(fresh));
    return true;
  },
  // Validate a downloaded backup file's text before any key derivation runs.
  // Returns the encrypted blob; throws a readable error for anything else.
  parseBackup(text) {
    let blob;
    try { blob = JSON.parse(text); } catch { throw new Error('This is not a SatoFinder backup file (not JSON).'); }
    const isB64 = (x) => typeof x === 'string' && /^[A-Za-z0-9+/]+={0,2}$/.test(x);
    if (!blob || typeof blob !== 'object' || blob.v !== 1 || blob.kdf !== 'PBKDF2-SHA256') {
      throw new Error('This is not a SatoFinder backup file (unknown format).');
    }
    if (!Number.isInteger(blob.iter) || blob.iter < BACKUP_MIN_ITER || blob.iter > BACKUP_MAX_ITER) {
      throw new Error('This backup file has an invalid key-derivation setting.');
    }
    if (!isB64(blob.salt) || !isB64(blob.iv) || !isB64(blob.ct)
        || Crypto.b64dec(blob.salt).length !== 16 || Crypto.b64dec(blob.iv).length !== 12
        || Crypto.b64dec(blob.ct).length < 17) {
      throw new Error('This backup file is damaged or incomplete.');
    }
    return { v: 1, kdf: blob.kdf, iter: blob.iter, salt: blob.salt, iv: blob.iv, ct: blob.ct };
  },
  wipe() {
    localStorage.removeItem(VAULT_KEY);
    localStorage.removeItem(PREFS_KEY);
  },
};

// A uniform random integer in [0, n) from the platform CSPRNG, by rejection
// sampling so no value is favoured.
function randomIndex(n) {
  const limit = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do { crypto.getRandomValues(buf); } while (buf[0] >= limit);
  return buf[0] % n;
}

// Cheap password-strength heuristic — no external lib. Returns 0..4 (zxcvbn-ish).
function passwordStrength(p) {
  if (!p) return 0;
  let s = 0;
  if (p.length >= 12) s++;
  if (p.length >= 16) s++;
  const classes = [/[a-z]/, /[A-Z]/, /[0-9]/, /[^A-Za-z0-9]/].filter(r => r.test(p)).length;
  if (classes >= 3) s++;
  if (classes >= 4 && p.length >= 14) s++;
  return Math.min(4, s);
}
const STRENGTH_LABEL = ['too weak', 'weak', 'fair', 'good', 'strong'];

// ====================== 05. STATE ======================
// Single mutable object + setState + subscribers. View machine fields
// (view, step, draft) hold UI-flow state so render fns stay pure.
const state = {
  // session
  locked: true,
  vaultExists: false,
  wallet: null,                            // { mnemonic, root: HDPrivateKey } — RAM only

  // view machine — drives renderApp dispatch:
  //   'landing' | 'create' | 'import' | 'unlock' | 'unlocked'
  view: 'landing',
  step: null,                              // sub-step inside a multi-screen flow
  draft: {},                               // transient inputs (mnemonic-in-progress, etc.)

  // derivation prefs (loaded from PREFS_KEY when present)
  bip: 44, coin: 0, account: 0, change: 0, addrIndex: 0,
  preset: 'default',
  derived: null,                           // { path, wif, pub, address }

  // network-derived
  price: null,                             // BSV/USD
  balance: null,                           // { confirmed, unconfirmed }
  history: [],
  recovery: null,
  tokens: null,                            // { address, ordinals: [], bsv20: [...] } | null


  // ui prefs
  hideKeys: true,
  feePerKb: DEFAULT_FEE_PER_KB,             // sat/KB used by send + sweep
  recoveryDepth: RECOVERY_DEPTH,            // addresses per branch the recovery scan covers

  // send flow — set by Actions.buildSend, cleared by cancel/broadcast
  draftTx: null,                           // { tx, hex, txid, to, sentSats, changeSats, fee, vsize }

  // ephemeral
  status: { kind: 'idle', msg: '' },
  busy: false,                             // disables interactive controls during async ops
};

const subscribers = new Set();
function subscribe(fn) { subscribers.add(fn); return () => subscribers.delete(fn); }
function setState(patch) {
  Object.assign(state, patch);
  for (const fn of subscribers) {
    try { fn(state); } catch (e) { console.error('subscriber error', e); }
  }
}

// ====================== 06. DERIVATION ======================
// Pure functions over a wallet root (bsv.HDPrivateKey). Builds BIP32 / BIP44
// paths from prefs, derives a child HDPrivateKey, and returns the address-set
// the keys panel renders. No DOM, no state — call from Actions and pass result.
const Derive = {
  pathFor(p) {
    if (p.bip === 32) return `m/0'/${p.change}'/${p.addrIndex}'`;
    return `m/44'/${p.coin}'/${p.account}'/${p.change}/${p.addrIndex}`;
  },
  derive(root, p) {
    const path = Derive.pathFor(p);
    const child = root.deriveChild(path);
    const priv  = child.privateKey;
    const pub   = bsv.PublicKey.fromPrivateKey(priv);
    const address = bsv.Address.fromPublicKey(pub).toString();
    return { path, wif: priv.toString(), pub: pub.toString(), address };
  },
};

// Transaction builder. Uses the two-pass fee pattern to avoid the legacy bug
// where _estimateFee() was called BEFORE outputs were added (index.html:1647
// in the old code) — the fee was systematically wrong. Here we build once at
// full amount, measure the real signed size, recompute the fee, then build
// again with the corrected output. Works for both single-recipient send and
// multi-UTXO recovery sweeps.
const TxBuilder = {
  // Build a single-recipient tx. `utxos` is an array shaped like WoC's
  // /address/unspent normalized to { txid, vout, satoshis, scriptHex }.
  // Returns { tx, hex, txid, fee, sentSats, changeSats }.
  // If `sentSats === 'max'`, sweeps the full input minus fee to `toAddress`
  // with no change output. Otherwise creates a change output back to fromAddress.
  send({ utxos, toAddress, sats, privateKey, fromAddress, feePerKb = state.feePerKb }) {
    if (!utxos || utxos.length === 0) throw new Error('No UTXOs to spend');
    if (!toAddress) throw new Error('No recipient address');
    const totalIn = utxos.reduce((a, u) => a + u.satoshis, 0);
    const isMax = sats === 'max';
    if (!isMax) {
      if (!Number.isInteger(sats) || sats <= 0) throw new Error('Amount must be a positive integer in sats');
      if (sats > totalIn) throw new Error('Amount exceeds spendable balance');
    }

    const inputs = utxos.map(u => ({
      txId: u.txid, outputIndex: u.vout,
      address: u.address || fromAddress,
      script: u.scriptHex || bsv.Script.buildPublicKeyHashOut(u.address || fromAddress).toHex(),
      satoshis: u.satoshis,
    }));

    // Pass 1: build with the chosen amount (or full input for max), sign, measure.
    const firstTo = isMax ? totalIn : sats;
    let t1 = new bsv.Transaction().from(inputs).feePerKb(feePerKb).to(toAddress, firstTo);
    if (!isMax) t1 = t1.change(fromAddress);
    t1.sign(privateKey);
    const vsize = t1.toBuffer().length;
    // 1 sat/byte safety pad on top of the standard rate to cover tiny ECDSA
    // signature length variations after the second-pass re-sign.
    const fee = Math.ceil((vsize * feePerKb) / 1000) + Math.ceil(vsize / 1000) + 10;

    // Pass 2: rebuild with the corrected amount.
    let sentSats, changeSats;
    let t2 = new bsv.Transaction().from(inputs).feePerKb(feePerKb);
    if (isMax) {
      sentSats = totalIn - fee;
      if (sentSats <= 546) throw new Error('Dust after fee — input too small to spend');
      t2 = t2.to(toAddress, sentSats);
      changeSats = 0;
    } else {
      sentSats = sats;
      changeSats = totalIn - sats - fee;
      if (changeSats < 0) throw new Error('Insufficient funds for amount + fee');
      t2 = t2.to(toAddress, sats);
      // Skip dust change outputs — fold into fee instead.
      if (changeSats > 546) t2 = t2.to(fromAddress, changeSats);
      else { changeSats = 0; }
    }
    t2.sign(privateKey);

    // Report what the signed transaction actually does, not the plan: a dust
    // change output folded into the fee makes the real fee larger than `fee`.
    if (!t2.isFullySigned() || t2.verify() !== true) throw new Error('Transaction did not sign correctly — nothing was built.');
    const outs = t2.outputs;
    const paysTo = (o, a) => { try { return o.script.toAddress('livenet').toString() === a; } catch { return false; } };
    const expectedOutputs = changeSats > 0 ? 2 : 1;
    if (outs.length !== expectedOutputs || !paysTo(outs[0], toAddress) || outs[0].satoshis !== sentSats
        || (changeSats > 0 && (!paysTo(outs[1], fromAddress) || outs[1].satoshis !== changeSats))) {
      throw new Error('Internal check failed: the signed outputs do not match the request — nothing was built.');
    }
    const signedFee = totalIn - outs.reduce((a, o) => a + o.satoshis, 0);
    const hex = t2.toString();
    return { tx: t2, hex, txid: t2.hash, fee: signedFee, sentSats, changeSats, vsize: t2.toBuffer().length, feePerKb };
  },
};

// Non-sensitive prefs persistence. Keeps the user on their preferred derivation
// (preset, coin path, account, change, index, hideKeys toggle) across reloads.
// Mnemonic is NEVER stored here.
const Prefs = {
  load() {
    try { return JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; }
    catch { return {}; }
  },
  save(p) {
    try {
      localStorage.setItem(PREFS_KEY, JSON.stringify({
        bip: p.bip, coin: p.coin, account: p.account,
        change: p.change, addrIndex: p.addrIndex,
        preset: p.preset, hideKeys: p.hideKeys,
        feePerKb: p.feePerKb,
      }));
    } catch {}
  },
};

// ====================== 07. NETWORK ======================
// All HTTP goes through api(): aborts after 15s, throws on non-2xx with the
// server's response body trimmed to 200 chars, parses JSON when possible
// (broadcast returns the txid as plain text, so we fall back to the raw body).
async function api(url, opts = {}) {
  const ctl = new AbortController();
  const timeout = opts.timeout ?? 15000;
  const t = setTimeout(() => ctl.abort(), timeout);
  try {
    const r = await fetch(url, { ...opts, signal: ctl.signal });
    const text = await r.text();
    if (!r.ok) throw new Error(`${r.status} ${r.statusText}: ${text.slice(0, 200)}`);
    try { return JSON.parse(text); } catch { return text; }
  } finally {
    clearTimeout(t);
  }
}

// Thin helpers per provider. Keep response shapes normalized at this layer so
// callers don't need to know which provider answered.
const Net = {
  woc: {
    balance:    (a) => api(ENDPOINTS.woc.balance(a)),
    // Every UTXO of the address across all pages, minus outputs already spent
    // by an unconfirmed transaction. Throws rather than return a partial list.
    unspent:    async (a) => {
                  const seen = new Map();
                  let token = '';
                  for (let page = 0; page < WOC_UTXO_MAX_PAGES; page++) {
                    const body = await api(ENDPOINTS.woc.unspentAll(a, token));
                    if (!body || !Array.isArray(body.result)) throw new Error('Unexpected unspent response');
                    for (const u of body.result) {
                      if (u.isSpentInMempoolTx) continue;
                      seen.set(`${u.tx_hash}:${u.tx_pos}`, u);
                    }
                    token = body.nextPageToken || '';
                    if (!token) return [...seen.values()];
                  }
                  throw new Error('Too many UTXOs at this address to list completely.');
                },
    history:    (a) => api(ENDPOINTS.woc.history(a)),
    txInfo:     (h) => api(ENDPOINTS.woc.txInfo(h)),
    price:      ()  => api(ENDPOINTS.woc.price),
    broadcast:  (txHex) => api(ENDPOINTS.woc.broadcast, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ txhex: txHex }),
                }),
  },
  gorillapool: {
    unspent:      (a, offset, bsv20) => api(ENDPOINTS.gorillapool.unspent(a, offset, bsv20)),
    bsv20Balance: (a) => api(ENDPOINTS.gorillapool.bsv20Balance(a)),
  },
  bitails: {
    unspent:      (a, from) => api(ENDPOINTS.bitails.unspent(a, from)),
    unspentMulti: (addrs) => api(ENDPOINTS.bitails.unspentMulti, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ addresses: addrs }),
                  }),
    historyMulti: (addrs) => api(ENDPOINTS.bitails.historyMulti, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ addresses: addrs }),
                  }),
  },
};

// Recovery: scan the first RECOVERY_DEPTH addresses on both receive (change=0)
// and change (change=1) branches under the current preset, fetch UTXOs in
// batches via bitails (the only provider with a multi-address endpoint), and
// fold the results into per-address records with derivation info attached so
// the user can sweep each one.
const Recovery = {
  // Every UTXO of an address that has at least one: `first` is the page the
  // batched call returned; later pages are fetched by offset until one comes
  // back empty, which is the only reliable end marker when the server's page
  // cap is unknown. Duplicates (the chain moved between pages) are dropped.
  async _allUnspent(address, first) {
    const seen = new Map();
    const add = (list) => { for (const u of list) seen.set(`${u.txid}:${u.vout}`, u); };
    add(first);
    let from = first.length;
    for (let page = 1; ; page++) {
      if (page >= BITAILS_MAX_PAGES) {
        throw new Error(`Too many UTXOs at ${address} to scan completely.`);
      }
      let rec;
      try { rec = await Net.bitails.unspent(address, from); }
      catch (e) { throw new Error(`bitails scan of ${address} failed at offset ${from}: ${e.message}`); }
      const list = rec && Array.isArray(rec.unspent) ? rec.unspent : null;
      if (!list) throw new Error('Unexpected bitails response shape');
      if (list.length === 0) break;
      add(list);
      from += list.length;
    }
    return [...seen.values()];
  },
  // Returns [{ path, address, wif, utxos: [normalized], totalSats }]
  // for every scanned address that has at least one UTXO.
  async scan(root, prefs, opts = {}) {
    const depth = opts.depth || RECOVERY_DEPTH;
    const onProgress = opts.onProgress || (() => {});
    // 1. Derive depth*2 candidate addresses (both branches).
    const candidates = [];
    for (let i = 0; i < depth; i++) {
      for (const change of [0, 1]) {
        const p = { ...prefs, change, addrIndex: i };
        const d = Derive.derive(root, p);
        candidates.push(d);
      }
    }
    onProgress({ stage: 'derived', total: candidates.length });

    // 2. Query bitails multi-unspent in batches of BITAILS_BATCH.
    const found = [];
    for (let off = 0; off < candidates.length; off += BITAILS_BATCH) {
      const batch = candidates.slice(off, off + BITAILS_BATCH);
      const addrs = batch.map(c => c.address);
      onProgress({ stage: 'scanning', done: off, total: candidates.length });
      let resp;
      try {
        resp = await Net.bitails.unspentMulti(addrs);
      } catch (e) {
        throw new Error(`bitails scan failed at offset ${off}: ${e.message}`);
      }
      if (!Array.isArray(resp)) throw new Error('Unexpected bitails response shape');
      // Bitails returns per-address records; join back with derivation info.
      const byAddr = Object.create(null);
      for (const rec of resp) byAddr[rec.address] = rec;
      for (const c of batch) {
        const rec = byAddr[c.address];
        if (!rec || !Array.isArray(rec.unspent) || rec.unspent.length === 0) continue;
        const raw = await Recovery._allUnspent(c.address, rec.unspent);
        const utxos = raw.map(u => ({
          txid: u.txid, vout: u.vout, satoshis: u.satoshis,
          address: c.address,
          scriptHex: bsv.Script.buildPublicKeyHashOut(c.address).toHex(),
        }));
        const totalSats = utxos.reduce((a, x) => a + x.satoshis, 0);
        found.push({ path: c.path, address: c.address, wif: c.wif, utxos, totalSats });
      }
    }
    onProgress({ stage: 'done', total: candidates.length, found: found.length });
    return found;
  },
};

// Tokens / ordinals classification. Wraps GorillaPool's 1Sat overlay
// (ordinals.gorillapool.io). Every Send and Sweep MUST call protectedSet()
// for the spend-side address before building a tx: if any UTXO in the WoC
// unspent list carries an inscription, a BSV-20 marker, or a lock, spending
// it as a plain sat would burn the NFT / destroy the token, so it must be
// filtered out of the spendable set.
//
// Hard policy: if the indexer is unreachable or returns a non-array, we
// THROW. Callers surface this as a block on the spend ("cannot verify your
// UTXOs are safe to spend"). No "I accept the risk" override in v2.4 —
// burning someone's NFT silently because an indexer was 503'd is exactly
// the failure mode we're trying to remove.
const Tokens = {
  // Is this 1Sat-overlay txo "protected" (must not be spent as plain sat)?
  isProtected(txo) {
    if (!txo || typeof txo !== 'object') return false;
    const o = txo.origin && txo.origin.data;
    if (!o) return false;
    return !!(o.insc || o.bsv20 || o.lock);
  },
  // Returns a Set of "txid:vout" strings for every protected UTXO at addr:
  // every page of the plain listing (ordinals / locks), and every output of
  // the BSV-20 listing. Throws on indexer error or an incomplete scan — callers
  // MUST catch and block the spend.
  async protectedSet(addr) {
    const set = new Set();
    const outpointOf = (t) => {
      if (typeof t.txid === 'string' && Number.isInteger(t.vout)) return `${t.txid}:${t.vout}`;
      const m = typeof t.outpoint === 'string' && t.outpoint.match(/^([0-9a-f]{64})_(\d+)$/);
      if (m) return `${m[1]}:${m[2]}`;
      throw new Error('Ordinal/token indexer returned an output without an outpoint — refusing to build.');
    };
    for (const bsv20 of [false, true]) {
      for (let page = 0, offset = 0; ; page++) {
        if (page >= ORDINALS_MAX_PAGES) {
          throw new Error('Too many ordinal/token outputs to check completely. Refusing to build — cannot verify UTXOs are safe to spend.');
        }
        let raw;
        try { raw = await Net.gorillapool.unspent(addr, offset, bsv20); }
        catch (e) { throw new Error(`Ordinal/token indexer unavailable (${e.message}). Refusing to build transaction — cannot verify UTXOs are safe to spend.`); }
        if (!Array.isArray(raw)) throw new Error('Ordinal/token indexer returned unexpected shape — refusing to build.');
        for (const t of raw) {
          // Everything the BSV-20 listing returns is a token output.
          if (bsv20 || Tokens.isProtected(t)) set.add(outpointOf(t));
        }
        if (raw.length < ORDINALS_PAGE) break;
        offset += raw.length;
      }
    }
    return set;
  },
  // Filter a normalized UTXO list against a protected Set. Every 1-sat output
  // is held back too: that is where ordinals live, and an indexer can lag
  // behind an ordinal that has just arrived. Returns
  // { spendable: [...], protectedCount: N }.
  filter(utxos, protectedSet) {
    const out = [];
    let pc = 0;
    for (const u of utxos) {
      if (u.satoshis === 1 || protectedSet.has(`${u.txid}:${u.vout}`)) pc++; else out.push(u);
    }
    return { spendable: out, protectedCount: pc };
  },
  // Pretty-print the classification of a single ordinal txo (for the Tokens
  // panel). Pulls the most-useful fields out of the origin.data.{map,insc}
  // shape; everything via textContent at the render layer, so even
  // attacker-controlled `app`/`name` is rendered safely.
  describeOrdinal(txo) {
    const o = (txo.origin && txo.origin.data) || {};
    const m = o.map || {};
    const i = o.insc || {};
    const f = i.file || {};
    return {
      outpoint: txo.outpoint || `${txo.txid}:${txo.vout}`,
      satoshis: txo.satoshis,
      name: m.name || '',
      app:  m.app  || '',
      type: f.type || '',
      size: f.size || 0,
      num:  (txo.origin && txo.origin.num) || '',
    };
  },
};

// Normalize WoC's unspent shape into what TxBuilder expects. Keeps the
// builder provider-agnostic.
function normalizeWocUtxos(raw, address) {
  if (!Array.isArray(raw)) throw new Error('Unexpected unspent response');
  return raw.map(u => ({
    txid: u.tx_hash, vout: u.tx_pos, satoshis: u.value, address,
    scriptHex: bsv.Script.buildPublicKeyHashOut(address).toHex(),
  }));
}

// Clamp a fee rate to something sane. Returns `fallback` for anything that
// isn't a usable number: a NaN or 0 here would silently build a zero-fee
// transaction that no miner accepts, and an absurd value would burn the
// balance as fee. Used for both live input and values read back from Prefs.
function sanitizeFeePerKb(value, fallback = DEFAULT_FEE_PER_KB) {
  const n = typeof value === 'number' ? value : parseInt(String(value ?? '').trim(), 10);
  if (!Number.isFinite(n) || !Number.isInteger(n) || n < 1) return fallback;
  return Math.min(n, MAX_FEE_PER_KB);
}

// Address validity (network-aware via SDK). Returns true/false.
// Mainnet P2PKH only: fromString() also accepts testnet addresses (coins sent
// there land on a mainnet script nobody expects) and P2SH, which BSV no
// longer treats as script-hash since Genesis.
function isValidAddress(addr) {
  try { return bsv.Address.isValid(addr, 'livenet', 'pubkeyhash'); } catch { return false; }
}

// Format helpers (pure, no DOM).
const Fmt = {
  sats: (n) => (n == null ? '' : new Intl.NumberFormat('en-US').format(n)),
  bsv:  (n) => (n == null ? '' : (n / 1e8).toFixed(8) + ' BSV'),
  usd:  (sats, rate) => {
    if (sats == null || rate == null) return '';
    const u = (sats * rate) / 1e8;
    return '$' + (u >= 0.01 ? u.toFixed(2) : u.toFixed(6));
  },
  shortHash: (h) => (h && h.length > 16 ? h.slice(0, 8) + '…' + h.slice(-8) : (h || '')),
  time: (unix) => {
    if (!unix) return '';
    try { return new Date(unix * 1000).toISOString().replace('T', ' ').slice(0, 16) + ' UTC'; }
    catch { return ''; }
  },
};

// ====================== 08. DOM ======================
function $(id) { return document.getElementById(id); }
function safeUrl(u) {
  const s = String(u);
  return /^(https?:|mailto:|#|\/)/.test(s) ? s : '#';
}
function el(tag, attrs = {}, children = []) {
  const n = document.createElement(tag);
  for (const k of Object.keys(attrs || {})) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class')       n.className = v;
    else if (k === 'dataset') Object.assign(n.dataset, v);
    else if (k === 'style')   n.setAttribute('style', String(v));
    else if (k.startsWith('on') && typeof v === 'function') {
      n.addEventListener(k.slice(2), v);
      // A field with a change handler commits its value to state; see renderApp.
      if (k === 'onchange') n.dataset.commits = '1';
    }
    else if (k === 'href' || k === 'src') n.setAttribute(k, safeUrl(v));
    else n.setAttribute(k, String(v));
  }
  const kids = Array.isArray(children) ? children : [children];
  for (const c of kids) {
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'string' || typeof c === 'number'
      ? document.createTextNode(String(c)) : c);
  }
  return n;
}

// Per-panel renderers. Each owns one DOM region and is pure (state) => void.
// renderApp is a view dispatcher; the real per-section panels (keys, balance,
// send, history, recovery) arrive in later phases.
// Every state change re-renders the whole view, which would wipe anything
// typed but not yet submitted. Within the same view and step, carry over each
// id'd field the user edited, plus focus and caret, into the new DOM. A field
// whose rendered default changed (state set it on purpose, e.g. "Use current")
// takes the new value; nothing carries across a view change (lock, unlock).
let lastRenderKey = null;
// Fields to leave empty on the next render even within the same view: set
// after a success so a finished form can't be resubmitted by accident.
const fieldsToClear = new Set();
function clearFieldsOnNextRender(...ids) { for (const id of ids) fieldsToClear.add(id); }
// Fields whose value was just committed through their change handler show
// what state now holds on the next render, not the typed text: the handler
// may have rejected or normalised it (a fee of 0 stays 100, a negative path
// index becomes 0). Fields without a handler keep the typed text as before.
const fieldsCommitted = new Set();
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t && t.id && t.dataset && t.dataset.commits) fieldsCommitted.add(t.id);
}, true);
function snapshotFields(root) {
  const fields = {};
  for (const f of root.querySelectorAll('input[id], textarea[id], select[id]')) {
    fields[f.id] = { value: f.value, defaultValue: f.defaultValue, checked: f.checked,
                     defaultChecked: f.defaultChecked, files: f.type === 'file' ? f.files : null };
  }
  const a = document.activeElement;
  const focus = a && a.id && root.contains(a)
    ? { id: a.id, start: a.selectionStart, end: a.selectionEnd } : null;
  return { fields, focus };
}
function restoreFields(root, snap) {
  for (const [id, old] of Object.entries(snap.fields)) {
    if (fieldsToClear.has(id) || fieldsCommitted.has(id)) continue;
    const f = root.querySelector(`#${CSS.escape(id)}`);
    if (!f) continue;
    if (f.type === 'file') { if (old.files && old.files.length) f.files = old.files; continue; }
    if (f.type === 'checkbox' || f.type === 'radio') {
      if (f.defaultChecked === old.defaultChecked) f.checked = old.checked;
      continue;
    }
    if (f.defaultValue === old.defaultValue && f.value !== old.value) f.value = old.value;
  }
  if (snap.focus) {
    const f = root.querySelector(`#${CSS.escape(snap.focus.id)}`);
    if (f) {
      f.focus();
      try { if (snap.focus.start != null) f.setSelectionRange(snap.focus.start, snap.focus.end); } catch { /* not a text field */ }
    }
  }
}
function renderApp(s) {
  const root = $('app');
  const key = `${s.view}|${s.step || ''}`;
  const snap = key === lastRenderKey ? snapshotFields(root) : null;
  lastRenderKey = key;
  while (root.firstChild) root.removeChild(root.firstChild);
  let view;
  switch (s.view) {
    case 'landing':  view = renderLanding(s); break;
    case 'create':   view = renderCreate(s);  break;
    case 'import':   view = renderImport(s);  break;
    case 'unlock':   view = renderUnlock(s);  break;
    case 'restore':  view = renderRestore(s); break;
    case 'unlocked': view = renderUnlockedPlaceholder(s); break;
    default:         view = renderLanding(s);
  }
  root.appendChild(view);
  if (snap) restoreFields(root, snap);
  fieldsToClear.clear();
  fieldsCommitted.clear();
}

function renderLanding(s) {

  return el('div', {}, [
    el('div', { class: 'panel' }, [
      el('h2', {}, haveVault ? 'Locked' : 'Welcome'),
      el('p', { class: 'muted' }, haveVault
        ? 'A vault exists on this device. Unlock with your password, or create / import a new wallet (this will REPLACE the existing vault).'
        : 'No vault on this device. Create a new wallet or import an existing 12/24-word mnemonic. Your seed is encrypted with a password you choose — never sent to any server.'),
    ]),
    haveVault ? el('div', { class: 'panel' }, [
      el('h2', {}, 'Unlock existing'),
      el('button', { class: 'primary', onclick: () => Actions.gotoUnlock() }, 'Unlock'),
    ]) : null,
    el('div', { class: 'panel' }, [
      el('h2', {}, 'Create new wallet'),
      el('p', { class: 'muted' }, 'Generates a fresh BIP39 mnemonic in your browser. Choose entropy:'),
      el('div', { class: 'row' }, [
        el('button', { onclick: () => Actions.startCreate(128) }, '12 words (128-bit)'),
        el('button', { onclick: () => Actions.startCreate(256) }, '24 words (256-bit)'),
      ]),
    ]),
    el('div', { class: 'panel' }, [
      el('h2', {}, 'Import existing mnemonic'),
      el('button', { onclick: () => Actions.startImport() }, 'Import 12/24-word phrase'),
    ]),
    el('div', { class: 'panel' }, [
      el('h2', {}, 'Restore encrypted backup'),
      el('p', { class: 'muted' }, 'Open a file saved with "Download encrypted backup", using the password it was made with.'),
      el('button', { onclick: () => Actions.gotoRestore() }, 'Restore from backup file'),
    ]),
    haveVault ? el('div', { class: 'panel' }, [
      el('h2', {}, 'Danger zone'),
      el('p', { class: 'muted' }, 'If you have forgotten your password, you must wipe the local vault and re-import the mnemonic. There is no password recovery — the encrypted blob is the only source of truth.'),
      el('button', { class: 'danger', onclick: () => Actions.confirmWipe() }, 'Wipe vault and start over'),
    ]) : null,
  ]);
}

function renderCreate(s) {
  if (s.step === 'show') return renderCreateShow(s);
  if (s.step === 'confirm') return renderCreateConfirm(s);
  if (s.step === 'password') return renderSetPassword(s, 'create');
  return renderLanding(s);
}
function renderImport(s) {
  if (s.step === 'enter') return renderImportEnter(s);
  if (s.step === 'password') return renderSetPassword(s, 'import');
  return renderLanding(s);
}
function renderRestore(s) {
  const fileId = 'restore-file', passId = 'pw-restore', replaceId = 'restore-replace';
  const replacing = Vault.exists();
  const submit = () => Actions.restoreBackup(
    $(fileId).files && $(fileId).files[0], $(passId).value, replacing ? $(replaceId).value : '');
  return el('div', { class: 'panel' }, [
    el('h2', {}, 'Restore encrypted backup'),
    el('p', { class: 'muted' }, 'Choose the backup file and enter the password it was made with. The file never leaves this browser; its recovery phrase is re-encrypted into this device\'s vault with the same password.'),
    el('input', { id: fileId, type: 'file', accept: 'application/json,.json' }),
    el('input', { id: passId, type: 'password', placeholder: 'Backup password', autocomplete: 'current-password',
                  onkeydown: (e) => { if (e.key === 'Enter') submit(); } }),
    replacing
      ? el('div', { style: 'margin-top:16px;padding-top:16px;border-top:1px solid var(--border)' }, [
          el('div', { class: 'err', style: 'font-size:12px;margin-bottom:8px' },
            'A wallet vault already exists on this device. Restoring will permanently replace it. ' +

function renderPathPanel(s) {
  // Build per-field inputs. BIP32 has two editable hardened indices; BIP44 has
  // four indices (coin, account, change, addr). All trigger Actions.setPathField
  // on change, which re-derives and persists prefs.
  const isBip44 = s.bip === 44;
  const fields = isBip44
    ? [
        ['coin',      "coin'",     s.coin],
        ['account',   "account'",  s.account],
        ['change',    'change',    s.change],
        ['addrIndex', 'index',     s.addrIndex],
      ]
    : [
        ['change',    "external'", s.change],
        ['addrIndex', "index'",    s.addrIndex],
      ];
  const inputs = fields.map(([f, label, val]) => {
    const fid = 'path-' + f;
    return el('div', { style: 'flex:1;min-width:90px' }, [
      el('div', { class: 'muted', style: 'font-size:11px;margin-bottom:4px' }, label),
      el('input', {
        id: fid, type: 'number', min: 0, value: String(val),
        onchange: () => Actions.setPathField(f, $(fid).value),
      }),
    ]);
  });
  return el('div', { class: 'panel' }, [
    el('h2', {}, 'Derivation path'),
    el('div', { class: 'row', style: 'margin-bottom:8px' }, [
      el('button', { class: isBip44 ? 'primary' : '', onclick: () => Actions.setBip(44) }, 'BIP44'),
      el('button', { class: !isBip44 ? 'primary' : '', onclick: () => Actions.setBip(32) }, 'BIP32'),
    ]),
    el('div', { class: 'muted', style: 'margin-bottom:8px' }, [
      'Path: ',
      el('code', {}, Derive.pathFor(s)),
    ]),
    el('div', { class: 'row' }, inputs),
  ]);
}

function renderKeysPanel(s) {
  const d = s.derived;
  if (!d) {
    return el('div', { class: 'panel' }, [
      el('h2', {}, 'Keys'),

  const hasPassphrase = !!(s.wallet && s.wallet.passphrase);
  const rows = [];
  rows.push(el('div', { class: hasPassphrase ? 'warn' : 'muted', style: 'font-size:11px;margin-bottom:8px' },
    hasPassphrase ? '⚑ BIP39 passphrase set — back up the passphrase alongside the mnemonic.'
                  : 'BIP39 passphrase: none (standard).'));
  rows.push(makeKeyRow('Address', d.address, () => Actions.copy(d.address, 'Address')));
  rows.push(makeKeyRow('Public key', d.pub, () => Actions.copy(d.pub, 'Public key')));
  if (!s.hideKeys) {
    rows.push(makeKeyRow('Private key (WIF)', d.wif, () => Actions.copySecret(d.wif, 'WIF'),
      'Anyone with this string can spend coins at this address.'));
    rows.push(makeKeyRow('Mnemonic', s.wallet && s.wallet.mnemonic,
      () => Actions.copySecret(s.wallet.mnemonic, 'Mnemonic'),
      'Your recovery phrase. Treat like cash.'));

        () => Actions.copySecret(s.wallet.passphrase, 'BIP39 passphrase'),
        'Required IN ADDITION to the mnemonic to recover this wallet.'));
    }
  } else {
    rows.push(el('div', { class: 'muted', style: 'margin-top:8px' },
      hasPassphrase
        ? 'Private key, mnemonic, and BIP39 passphrase hidden. Click "Show private keys" above to reveal.'

function renderSendPanel(s) {
  const d = s.derived;
  const draft = s.draftTx;

  }
  if (draft) return renderSendConfirm(s, draft);
  const toId = 'send-to', amtId = 'send-amt', feeId = 'send-fee';
  const setMax = () => {
    if (!s.balance) { Status.error('Refresh balance first.'); return; }
    // Use a generous fee-pad guess (~300 sat covers a normal tx well past
    // 100 sat/KB) and let the builder
    // recompute. Worst case the user clicks "max" and gets a slightly small
    // amount back; nothing breaks.
    const total = s.balance.confirmed + s.balance.unconfirmed;
    $(amtId).value = String(Math.max(0, total - 300));
  };
  return el('div', { class: 'panel' }, [
    el('h2', {}, 'Send BSV'),
    el('p', { class: 'muted', style: 'font-size:11px' }, 'From: ' + d.address),
    el('div', { style: 'margin-bottom:8px' }, [
      el('div', { class: 'muted', style: 'font-size:11px;margin-bottom:4px' }, 'Recipient address'),
      el('input', { id: toId, type: 'text', placeholder: '1...', autocomplete: 'off',

    el('div', { style: 'margin-bottom:8px' }, [

      el('div', { class: 'row' }, [
        el('input', { id: amtId, type: 'number', min: '1', step: '1', placeholder: '0' }),
        el('button', { onclick: setMax, style: 'flex:0 0 auto' }, 'Max'),
      ]),
    ]),
    el('div', { style: 'margin-bottom:8px' }, [
      el('div', { class: 'muted', style: 'font-size:11px;margin-bottom:4px' },
        'Fee rate (sat/KB) — applies to Send and to recovery sweeps'),

        el('input', {
          id: feeId, type: 'number', min: '1', max: String(MAX_FEE_PER_KB), step: '1',
          value: String(s.feePerKb),

                       onclick: () => Actions.setFeePerKb(DEFAULT_FEE_PER_KB) }, 'Default'),

                     onclick: () => Actions.buildSend($(toId).value, $(amtId).value) },

function renderRecoveryPanel(s) {
  const rec = s.recovery;
  const depth = RECOVERY_DEPTHS.includes(s.recoveryDepth) ? s.recoveryDepth : RECOVERY_DEPTH;
  const d = s.derived;
  const swept = (s.draft && s.draft.swept) || {};
  // Destination field: defaults to the current derived address, but the user
  // can override (e.g. sweep to a hardware-wallet address). Re-deriving here
  // so changes to the path panel propagate as the default until the user
  // edits the input. After edit, the typed value wins (lives in DOM until
  // explicitly reset).
  const defaultDest = (s.draft && typeof s.draft.recoveryDest === 'string')
    ? s.draft.recoveryDest
    : (d ? d.address : '');
  const destId = 'recovery-dest';
  // Changing the destination discards a prepared sweep-all plan and an open
  // preview: their transactions are already signed to the old address.
  const setDest = () => {
    const next = { ...state.draft, recoveryDest: $(destId).value.trim() };
    delete next.sweepAllPlan; delete next.sweepPreview;
    setState({ draft: next });
  };
  const resetDest = () => {
    if (!d) return;
    const next = { ...state.draft }; delete next.recoveryDest; delete next.sweepAllPlan; delete next.sweepPreview;
    setState({ draft: next });
  };
  const plan = s.draft && s.draft.sweepAllPlan;

  return el('div', { class: 'panel' }, [
    el('h2', {}, 'Recovery sweep'),
    el('p', { class: 'muted' }, `Scans the first ${depth} receive + ${depth} change addresses under the current preset for stray UTXOs. Coins further out need a deeper scan. Edit the destination below before sweeping if you want to send to a different wallet.`),
    el('div', { class: 'row', style: 'margin-bottom:12px;align-items:center' }, [
      el('span', { class: 'muted', style: 'font-size:11px;flex:0 0 auto' }, 'Addresses per branch'),
      el('select', { id: 'recovery-depth', disabled: s.busy,
                     onchange: () => Actions.setRecoveryDepth($('recovery-depth').value) },
        RECOVERY_DEPTHS.map((n) => el('option', { value: String(n), selected: n === depth }, String(n)))),
    ]),

    // Destination input — visible whenever results exist OR before scanning,
    // so users see the destination policy up-front.
    el('div', { style: 'margin-bottom:12px' }, [
      el('div', { class: 'muted', style: 'font-size:11px;margin-bottom:4px' },
        'Send recovered coins to'),
      el('div', { class: 'row' }, [
        el('input', {
          id: destId, type: 'text', placeholder: 'BSV address (e.g. 1xyz…)',
          autocomplete: 'off', spellcheck: 'false',
          value: defaultDest,
          onchange: setDest,
        }),
        el('button', { onclick: resetDest, disabled: !d, style: 'flex:0 0 auto',
                       title: 'Reset to current derived address' },
          'Use current'),
      ]),
      el('div', { class: 'muted', style: 'font-size:11px;margin-top:4px' },
        d ? `Default: your current derived address ${Fmt.shortHash(d.address)}. Change this field to sweep to any other BSV address you control.`
          : 'Derive an address first, or paste any BSV address.'),
    ]),

    el('div', { class: 'row', style: 'margin-bottom:8px' }, [
      el('button', { disabled: s.busy, onclick: () => Actions.scanRecovery() },
        s.busy && rec && rec.scanning ? `Scanning… ${rec.done || 0}/${rec.total || ''}`
                                       : (rec ? 'Re-scan' : `Scan first ${depth} addresses`)),
      rec && rec.found && rec.found.length > 1 && !plan
        ? el('button', { class: 'primary', disabled: s.busy,
                         onclick: () => Actions.prepareSweepAll() },
            s.busy ? 'Building…' : `Prepare sweep of all (${rec.found.length})`)
        : null,
    ]),
    plan ? renderSweepAllPlan(s, plan) : null,
    !rec ? null
         : !rec.found || rec.found.length === 0
           ? el('p', { class: 'muted' }, rec.scanning ? 'Scanning…' : 'No UTXOs found in scanned range.')
           : el('div', {}, [
              el('p', {}, [
                'Found ', el('strong', {}, String(rec.found.length)),
                ' address(es) with ', el('strong', {}, Fmt.sats(rec.totalSats)),
                ' sats recoverable.',
              ]),
              rec.depth && rec.depth !== depth
                ? el('p', { class: 'warn', style: 'font-size:11px' },
                    `These results are from a scan of ${rec.depth} addresses per branch. Re-scan to use ${depth}.`)
                : null,
              ...rec.found.map((item) => renderRecoveryRow(s, item, swept[item.path])),
            ]),
  ]);
}
// Totals for a prepared sweep-all, built from the signed drafts themselves.
function renderSweepAllPlan(s, plan) {
  const sum = (k) => plan.drafts.reduce((a, d) => a + d[k], 0);
  const protectedTotal = sum('protectedCount');
  return el('div', { class: 'panel', style: 'border-color:var(--accent,#c90);margin-bottom:12px' }, [
    el('h3', {}, 'Confirm sweep of all recovered addresses'),
    plan.drafts.length === 0 ? el('p', { class: 'muted' }, 'No transaction could be built.') : el('div', {}, [
      el('p', {}, [
        el('strong', {}, String(plan.drafts.length)), ' separate transaction(s), one per address, sending ',
        el('strong', {}, `${Fmt.sats(sum('sentSats'))} sats`), ' in total to ',
      ]),
      el('code', { style: 'display:block;margin-bottom:8px' }, plan.dest),
      el('p', {}, ['Total miner fees: ', el('strong', {}, `${Fmt.sats(sum('fee'))} sats`),
                   `. Total spent from these addresses: ${Fmt.sats(sum('sentSats') + sum('fee'))} sats.`]),
