// Status helpers used everywhere.
const Status = {
  info(msg)  { setState({ status: { kind: 'info',  msg } }); },
  error(msg) { setState({ status: { kind: 'error', msg } }); },
  clear()    { setState({ status: { kind: 'idle',  msg: '' } }); },
};

// ====================== 09. EVENTS / ACTIONS ======================
// All user-driven mutations go through Actions.* — each returns void, updates
// state via setState, and surfaces errors via Status.error. Render functions
// wire these as onclick handlers via el(...).
// Bumped whenever the open wallet goes away or changes (lock, wipe, unlock,
// create/import), so async work started for one wallet can tell it is stale
// and must not touch state or keep spending.
let walletSession = 0;
// Everything derived from the open wallet: its keys, recovered keys, balances
// and drafts. Cleared together so nothing outlives the wallet it came from.
const clearedWalletState = () => ({
  wallet: null, derived: null, balance: null, history: [], recovery: null,
  tokens: null, draftTx: null, draft: {}, busy: false,
});
// Address-scoped results (balance, history, tokens, a send draft) also go
// stale when the derivation path changes, which replaces state.derived.
// Did the node's reply name the transaction we signed? If not, the outcome is
// unknown: say so and give the signed TXID to look up before retrying, since
// a rebuilt transaction could spend again.
const broadcastMatches = (raw, localTxid) =>
  (typeof raw === 'string' ? raw.trim().replace(/^"|"$/g, '') : '') === localTxid;
const unknownOutcome = (txid) =>
  `The broadcast reply did not confirm this transaction. Look up ${txid} on WhatsOnChain before trying again.`;
const stillCurrent = (session, derived) => session === walletSession && state.derived === derived;

const Actions = {
  // ---- view navigation
  gotoLanding()  { Status.clear(); setState({ view: 'landing', step: null, draft: {} }); },
  gotoUnlock()   { Status.clear(); setState({ view: 'unlock',  step: null }); },
  gotoRestore()  { Status.clear(); setState({ view: 'restore', step: null }); },

  // Restore a file made by "Download encrypted backup". The file is only read:
  // its phrase is decrypted with the password, checked, and saved as a fresh
  // vault at the current iteration count, then the wallet opens.
  async restoreBackup(file, password, replaceTyped) {
    if (state.busy) { Status.error('Another operation is still running. Try again when it finishes.'); return; }
    if (!file) { Status.error('Choose the backup file first.'); return; }
    if (!password) { Status.error('Enter the password this backup was made with.'); return; }
    if (file.size > BACKUP_MAX_BYTES) { Status.error('This file is too large to be a SatoFinder backup.'); return; }
    if (Vault.exists() && (replaceTyped || '').trim() !== 'REPLACE') {
      Status.error('A vault already exists on this device. Type REPLACE to overwrite it.');
      return;
    }
    setState({ busy: true });
    const session = walletSession;
    try {
      const blob = Vault.parseBackup(await file.text());
      const payload = JSON.parse(await Crypto.decrypt(password, blob));   // throws 'Wrong password'
      if (session !== walletSession) {
        // Nothing has been written yet.
        Status.info('Restore stopped because the wallet was unlocked or locked meanwhile. Nothing was changed.');
        return;
      }
      const mnemonic = payload && typeof payload.mnemonic === 'string' ? payload.mnemonic.trim() : '';
      const passphrase = payload && typeof payload.passphrase === 'string' ? payload.passphrase : '';
      // isValid throws, rather than returning false, for some malformed input.
      let validPhrase = false;
      try { validPhrase = bsv.Mnemonic.isValid(mnemonic); } catch { validPhrase = false; }
      if (!validPhrase) throw new Error('The backup decrypted, but it does not hold a valid recovery phrase.');
      // Open the wallet before touching the stored vault: if it can't open,
      // the existing vault stays as it is.
      const wallet = Wallet.openFromMnemonic(mnemonic, passphrase);
      const sealed = await Vault.seal(mnemonic, password, passphrase);
      if (session !== walletSession) {
        setState({ busy: false });
        Status.info('Restore stopped because the vault changed meanwhile. Nothing was changed.');
        return;
      }
      Vault.commit(sealed);
      walletSession++;
      setState({
        ...clearedWalletState(),
        wallet, locked: false, vaultExists: true, view: 'unlocked', step: null,
      });
      AutoLock.start();
      Actions._rederive();
      Status.info('Backup restored and unlocked.' + (passphrase ? ' (BIP39 passphrase restored)' : ''));
    } catch (e) {
      if (session !== walletSession) return;
      setState({ busy: false });
      Status.error(e.message || 'Could not restore this backup.');
    }
  },
  gotoShow()     { setState({ view: 'create', step: 'show' }); },
  // The backup check asks for BACKUP_CHECK_WORDS words at random positions,
  // chosen once per phrase so re-renders and "show again" keep the same ones.
  gotoConfirm() {
    const words = (state.draft.mnemonic || '').split(/\s+/).filter(Boolean);
    let positions = state.draft.checkPositions;
    if (!Array.isArray(positions) || positions.some(i => i >= words.length)) {
      const picked = new Set();
      while (picked.size < Math.min(BACKUP_CHECK_WORDS, words.length)) picked.add(randomIndex(words.length));
      positions = [...picked].sort((a, b) => a - b);
    }
    setState({ view: 'create', step: 'confirm', draft: { ...state.draft, checkPositions: positions } });
  },

  // ---- create flow
  startCreate(entropyBits) {
    try {
      // bsv.Mnemonic.fromRandom(bits) takes an entropy bit count: 128/160/192/
      // 224/256 -> 12/15/18/21/24 words. The function's declared .length is 0
      // (minified varargs), so do NOT guard on .length — just pass the bits.
      const bits = (entropyBits === 256 || entropyBits === 224 || entropyBits === 192
                 || entropyBits === 160 || entropyBits === 128) ? entropyBits : 128;
      const m = bsv.Mnemonic.fromRandom(bits);
      const phrase = m.toString();
      // Sanity: BIP39 word counts per entropy bits. If the SDK ever ignored
      // our arg, surface it rather than silently shipping the wrong size.
      const expectedWords = { 128:12, 160:15, 192:18, 224:21, 256:24 }[bits];
      const gotWords = phrase.split(/\s+/).length;
      if (gotWords !== expectedWords) {
        throw new Error(`SDK returned ${gotWords} words; expected ${expectedWords} for ${bits}-bit entropy`);
      }
      setState({
        view: 'create', step: 'show',
        draft: { mnemonic: phrase, source: 'create', entropyBits: bits },
      });
    } catch (e) {
      Status.error(`Could not generate mnemonic: ${e.message}`);
    }
  },
  cancelCreate() { Actions.gotoLanding(); },

  // typed: the entered words, in the order of state.draft.checkPositions.
  // Says only whether all match, so the check can't be solved word by word.
  checkBackupWords(typed) {
    const words = (state.draft.mnemonic || '').split(/\s+/).filter(Boolean);
    const positions = state.draft.checkPositions || [];
    const norm = (w) => (w || '').trim().toLowerCase();
    const allMatch = positions.length > 0 && positions.every((pos, k) => norm(typed[k]) === norm(words[pos]));
    if (!allMatch) {
      Status.error('Those words don\'t match your recovery phrase — check your written copy.');
      return;
    }
    Status.clear();
    setState({ view: 'create', step: 'password' });
  },

  // ---- import flow
  startImport() {
    Status.clear();
    setState({ view: 'import', step: 'enter', draft: { source: 'import' } });
  },
  submitImport(text, passphrase) {
    const phrase = (text || '').trim().replace(/\s+/g, ' ').toLowerCase();
    const words = phrase.split(' ').filter(Boolean);
    if (words.length !== 12 && words.length !== 24) {
      Status.error(`Expected 12 or 24 words, got ${words.length}.`); return;
    }
    if (!bsv.Mnemonic.isValid(phrase)) {
      Status.error('Invalid BIP39 mnemonic (bad word or failed checksum).'); return;
    }
    Status.clear();
    setState({
      view: 'import', step: 'password',
      draft: { mnemonic: phrase, passphrase: passphrase || '', source: 'import' },
    });
  },

  // ---- password set (used by both create and import). Accepts an optional
  // BIP39 passphrase ("25th word") — different from pw1/pw2 which encrypt the
  // local vault. Both are stored in the encrypted vault blob.
  async setPassword(pw1, pw2, origin, bip39Pass, replaceTyped) {
    if (state.busy) { Status.error('Another operation is still running. Try again when it finishes.'); return; }
    if (!pw1 || pw1.length < 12) { Status.error('Password must be at least 12 characters.'); return; }
    if (pw1 !== pw2) { Status.error('Passwords do not match.'); return; }
    if (passwordStrength(pw1) < 2) { Status.error('Password is too weak — mix character classes and length.'); return; }
    if (Vault.exists() && (replaceTyped || '').trim() !== 'REPLACE') {
      Status.error('A vault already exists on this device. Type REPLACE to overwrite it.');
      return;
    }
    const mnemonic = state.draft.mnemonic;
    if (!mnemonic) { Status.error('No mnemonic in flow — start over.'); Actions.gotoLanding(); return; }
    // On Create, the passphrase comes from this screen's input. On Import, it
    // was captured earlier on the mnemonic-entry screen and lives in draft.
    const passphrase = (typeof bip39Pass === 'string' ? bip39Pass : state.draft.passphrase) || '';

    setState({ busy: true });
    const session = walletSession;
    try {
      // Open the wallet first: nothing is stored unless it opens.
      const wallet = Wallet.openFromMnemonic(mnemonic, passphrase);
      const blob = await Vault.seal(mnemonic, pw1, passphrase);
      if (session !== walletSession) {
        // Locked, wiped or replaced while encrypting: nothing has been written.
        setState({ busy: false });
        Status.info('Stopped because the vault changed meanwhile. Nothing was saved.');
        return;
      }
      Vault.commit(blob);
      walletSession++;
      setState({
        ...clearedWalletState(),
        wallet, locked: false, vaultExists: true,
        view: 'unlocked', step: null,
      });
      AutoLock.start();
      Actions._rederive();
      const passNote = passphrase ? ' (BIP39 passphrase set)' : '';
      Status.info((origin === 'import' ? 'Imported & unlocked.' : 'Wallet created & unlocked.') + passNote);
    } catch (e) {
      if (session !== walletSession) return;
      setState({ busy: false });
      Status.error(`Could not save vault: ${e.message}`);
    }
  },

  // ---- unlock
  async unlock(password) {
    if (state.busy) { Status.error('Another operation is still running. Try again when it finishes.'); return; }
    if (!password) { Status.error('Enter your password.'); return; }
    setState({ busy: true });
    const session = walletSession;
    const rawBefore = Vault.raw();   // for the in-place iteration upgrade below
    try {
      const { mnemonic, passphrase } = await Vault.unlock(password);
      if (session !== walletSession) return;   // locked or wiped while decrypting
      const wallet = Wallet.openFromMnemonic(mnemonic, passphrase);
      walletSession++;
      setState({
        ...clearedWalletState(),
        wallet, locked: false, view: 'unlocked', step: null,
      });
      AutoLock.start();
      Actions._rederive();
      Status.info('Unlocked.');
      // Bring an older vault up to the current iteration count, in the
      // background: the wallet is already open, and failure keeps the old one.
      Vault.upgradeIfNeeded(password, rawBefore).catch((e) => {
        console.warn('Vault iteration upgrade skipped:', e && e.message);
      });
    } catch (e) {
      if (session !== walletSession) return;
      setState({ busy: false });
      Status.error(e.message || 'Unlock failed.');
    }
  },

  // ---- lock / wipe
  lock() {
    walletSession++;
    setState({ ...clearedWalletState(), locked: true, view: 'landing', step: null });
    AutoLock.disarm();
    if (ClipboardGuard.pending()) ClipboardGuard.clearNow();
    Status.info('Locked.');
  },
  confirmWipe() {
    const typed = prompt('Type DELETE to wipe the local vault. This cannot be undone.');
    if (typed !== 'DELETE') { Status.info('Wipe cancelled.'); return; }
    Vault.wipe();
    if (ClipboardGuard.pending()) ClipboardGuard.clearNow();
    walletSession++;
    setState({
      ...clearedWalletState(), locked: true, vaultExists: false,
      view: 'landing', step: null,
    });
    Status.info('Vault wiped.');
  },

  // ---- clipboard (no auto-copy — only on explicit click)
  // Returns true if the text was copied. Any copy supersedes a pending
  // secret clear: the clipboard no longer holds that secret.
  async copyToClipboard(text) {
    try {
      await navigator.clipboard.writeText(text);
      ClipboardGuard.cancel();
      Status.info('Copied to clipboard.');
      return true;
    } catch {
      Status.error('Clipboard copy failed (browser blocked it).');
      return false;
    }
  },
  copy(text, label) {
    Actions.copyToClipboard(text).then((ok) => {
      if (ok && label) Status.info(`${label} copied.`);
    });
  },
  // For keys, phrases and passphrases: the clipboard is cleared after
  // CLIPBOARD_CLEAR_MS or at lock, whichever comes first.
  copySecret(text, label) {
    const session = walletSession;
    Actions.copyToClipboard(text).then((ok) => {
      if (!ok) return;
      // Locked while the copy was in flight: take the secret back off at once.
      if (session !== walletSession) { ClipboardGuard.clearNow(); return; }
      ClipboardGuard.schedule();
      Status.info(`${label} copied. It will be cleared from the clipboard after ${CLIPBOARD_CLEAR_MS / 1000} seconds or when the wallet locks, once this page is in front again. Closing the tab first leaves it on the clipboard.`);
    });
  },

  // ---- derivation: preset / bip toggle / individual path fields
  // Each mutator re-derives synchronously and persists the (non-sensitive) prefs.
  setPreset(name) {
    const p = PRESETS[name];
    if (!p) return;
    const patch = { preset: name, bip: p.bip };
    if (p.bip === 44) {
      patch.coin = p.coin ?? 0;
      patch.account = p.account ?? 0;
      patch.change = 0;
      patch.addrIndex = 0;
    } else {
      patch.change = 0;
      patch.addrIndex = 0;
    }
    setState(patch);
    Actions._rederive();
  },
  setBip(b) {
    if (b !== 32 && b !== 44) return;
    setState({ bip: b, change: 0, addrIndex: 0,
               preset: b === 32 ? 'bip32basic' : 'default' });
    Actions._rederive();
  },
  setPathField(field, raw) {
    const n = Math.max(0, parseInt(raw, 10) || 0);
    if (!['coin','account','change','addrIndex'].includes(field)) return;
    setState({ [field]: n, preset: null });   // custom path -> no preset is active
    Actions._rederive();
  },
  toggleHideKeys() {
    setState({ hideKeys: !state.hideKeys });
    Prefs.save(state);
  },

  // Internal: re-derive from current wallet + prefs, save prefs, clear caches.
  _rederive() {
    if (!state.wallet || !state.wallet.root) return;
    try {
      const derived = Derive.derive(state.wallet.root, state);
      // Path change invalidates any address-scoped data (balance/history/tokens).
      setState({ derived, balance: null, history: [], tokens: null });
      Prefs.save(state);
    } catch (e) {
      Status.error(`Derivation failed: ${e.message}`);
    }
  },

  // ---- network: price (boot-time, best effort) / balance / history
  async fetchPrice() {
    try {
      const data = await Net.woc.price();
      if (data && typeof data.rate === 'number') setState({ price: data.rate });
    } catch (e) {
      // Non-fatal: just leaves USD column empty.
      console.warn('price fetch failed:', e.message);
    }
  },
  async refreshBalance() {
    if (!state.derived) { Status.error('No address derived.'); return; }
    setState({ busy: true });
    const session = walletSession;
    const derived = state.derived;
    try {
      const data = await Net.woc.balance(state.derived.address);
      if (!stillCurrent(session, derived)) return;   // wallet locked or switched meanwhile
      if (typeof data.confirmed !== 'number' || typeof data.unconfirmed !== 'number') {
        throw new Error('Unexpected balance response');
      }
      setState({ balance: { confirmed: data.confirmed, unconfirmed: data.unconfirmed }, busy: false });
      Status.clear();
      // Refresh price if we don't have it yet (cheap fallback).
      if (state.price == null) Actions.fetchPrice();
    } catch (e) {
      if (!stillCurrent(session, derived)) return;
      setState({ busy: false });
      Status.error(`Balance fetch failed: ${e.message}`);
    }
  },
  // ---- send flow: build (preview) then broadcast (confirm)
  // Fee rate is a pref, not a per-transaction argument: sweeps use it too, and
  // it must survive a lock/reload the same way the derivation prefs do.
  setFeePerKb(raw) {
    const feePerKb = sanitizeFeePerKb(raw);
    setState({ feePerKb });
    Prefs.save(state);
    // Say so whenever the value in use isn't the value asked for — whether it
    // was rejected outright or silently clamped to the ceiling.
    const asked = typeof raw === 'number' ? raw : parseInt(String(raw ?? '').trim(), 10);
    if (!Number.isFinite(asked) || asked !== feePerKb) {
      Status.error('Fee rate must be a whole number from 1 to ' + Fmt.sats(MAX_FEE_PER_KB) +
                   ' sat/KB — using ' + Fmt.sats(feePerKb) + ' sat/KB.');
    }
  },

  async buildSend(toRaw, amtRaw) {
    Status.clear();
    if (!state.derived) { Status.error('No address derived.'); return; }
    const to = (toRaw || '').trim();
    if (!to) { Status.error('Enter a recipient address.'); return; }
    if (!isValidAddress(to)) { Status.error('Recipient must be a mainnet BSV address starting with 1 (P2PKH).'); return; }
    const sats = parseInt(String(amtRaw).trim(), 10);
    if (!Number.isFinite(sats) || !Number.isInteger(sats) || sats <= 0) {
      Status.error('Amount must be a positive whole number of satoshis.');
      return;
    }
    if (sats < 546) { Status.error('Amount is below dust threshold (546 sats).'); return; }

    setState({ busy: true });
    const session = walletSession;
    const derived = state.derived;
    try {
      // Fetch protected set FIRST. If the indexer is down we block entirely
      // (Tokens.protectedSet throws with a clear message); building anyway
      // could burn an NFT or destroy a token at this address.
      const protectedSet = await Tokens.protectedSet(derived.address);
      if (!stillCurrent(session, derived)) return;   // wallet locked or switched meanwhile
      const raw = await Net.woc.unspent(derived.address);
      if (!stillCurrent(session, derived)) return;   // wallet locked or switched meanwhile
      const allUtxos = normalizeWocUtxos(raw, derived.address);
      const { spendable, protectedCount } = Tokens.filter(allUtxos, protectedSet);
      if (spendable.length === 0) {
        throw new Error(protectedCount > 0
          ? `All ${protectedCount} UTXOs at this address carry ordinals or tokens (protected). Nothing safe to spend.`
          : 'No spendable UTXOs at this address.');
      }
      const priv = bsv.PrivateKey.fromWIF(derived.wif);
      const draft = TxBuilder.send({
        utxos: spendable, toAddress: to, sats,
        privateKey: priv, fromAddress: derived.address,
      });
      setState({
        draftTx: { ...draft, to, protectedCount, tx: undefined /* drop tx to keep state JSON-clean */ },
        busy: false,
      });
      Status.info(`Transaction built (${protectedCount} ordinal/token UTXOs protected). Review and confirm to broadcast.`);
    } catch (e) {
      if (!stillCurrent(session, derived)) return;
      setState({ busy: false });
      Status.error(`Build failed: ${e.message}`);
    }
  },
  cancelSend() { setState({ draftTx: null }); Status.info('Send cancelled.'); },
  async broadcastSend() {
    const d = state.draftTx;
    if (!d || !d.hex) { Status.error('No draft transaction.'); return; }
    setState({ busy: true });
    const session = walletSession;
    try {
      const txid = await Net.woc.broadcast(d.hex);
      // The broadcast happened either way, so always report it; only the state
      // belongs to the session that started it.
      const ok = broadcastMatches(txid, d.txid);
      // On an unknown outcome keep the draft: re-sending the same signed hex
      // can't pay twice, unlike building a new transaction.
      if (session === walletSession) {
        setState(ok ? { draftTx: null, busy: false, balance: null } : { busy: false, balance: null });
      }
      if (ok) {
        // The payment is done: don't leave the form filled for a second send.
        clearFieldsOnNextRender('send-to', 'send-amt', 'tip-amt');
        Status.info(`Broadcast OK. Txid: ${d.txid}`);
      }
      else Status.error(unknownOutcome(d.txid));
    } catch (e) {
      if (session !== walletSession) return;
      setState({ busy: false });
      Status.error(`Broadcast failed: ${e.message}`);
    }
  },

  setRecoveryDepth(raw) {
    const n = parseInt(raw, 10);
    if (!RECOVERY_DEPTHS.includes(n)) { Status.error('Choose one of the listed scan depths.'); return; }
    setState({ recoveryDepth: n });
  },

  // ---- recovery scan + sweep
  async scanRecovery() {
    if (!state.wallet || !state.wallet.root) { Status.error('Wallet locked.'); return; }
    const session = walletSession;
    // A re-scan replaces the found items, so prepared sweeps built from the old
    // results are dropped, and so are the "swept" marks: new coins can arrive
    // at an address swept earlier, and the fresh scan is what shows them.
    const draft = { ...state.draft }; delete draft.sweepAllPlan; delete draft.sweepPreview; delete draft.swept;
    const depth = RECOVERY_DEPTHS.includes(state.recoveryDepth) ? state.recoveryDepth : RECOVERY_DEPTH;
    setState({ busy: true, draft, recovery: { scanning: true, done: 0, total: depth * 2 } });
    try {
      const onProgress = (p) => {
        if (session !== walletSession) return;
        if (p.stage === 'scanning') {
          setState({ recovery: { ...state.recovery, done: p.done, total: p.total } });
        }
      };
      const found = await Recovery.scan(state.wallet.root, state, { depth, onProgress });
      if (session !== walletSession) return;   // locked or switched: drop the results
      const totalSats = found.reduce((a, x) => a + x.totalSats, 0);
      setState({
        busy: false,
        recovery: { scanning: false, found, totalSats, depth, done: depth * 2, total: depth * 2 },
      });
      Status.info(found.length === 0 ? 'Recovery scan complete — nothing found.' : `Found ${found.length} addresses with ${Fmt.sats(totalSats)} sats.`);
    } catch (e) {
      if (session !== walletSession) return;
      setState({ busy: false });
      Status.error(`Recovery scan failed: ${e.message}`);
    }
  },
  // Resolves the recovery destination: user-edited value in state.draft if
  // any, else the current derived address. Returns the trimmed string (or '').
  _recoveryDest() {
    if (state.draft && typeof state.draft.recoveryDest === 'string') {
      return state.draft.recoveryDest.trim();
    }
    return state.derived ? state.derived.address : '';
  },
  // Pure-ish builder (no DOM, no broadcast). Throws on bad inputs / insufficient
  // funds / indexer down. Returns a sweep draft including protectedCount so the
  // UI can show "swept N sats, protected M ordinal/token UTXOs".
  async _buildSweepDraft(item, destAddress) {
    if (!destAddress) throw new Error('No destination — enter or derive an address first.');
    if (!isValidAddress(destAddress)) throw new Error('Destination must be a mainnet BSV address starting with 1 (P2PKH).');
    if (!item || !item.utxos || item.utxos.length === 0) throw new Error('Nothing to sweep.');
    // Indexer-down here = hard block. Burning an ordinal would be irreversible.
    const protectedSet = await Tokens.protectedSet(item.address);
    const { spendable, protectedCount } = Tokens.filter(item.utxos, protectedSet);
    if (spendable.length === 0) {
      throw new Error(protectedCount > 0
        ? `All ${protectedCount} UTXOs at ${item.address} carry ordinals or tokens (protected). Nothing safe to sweep.`
        : 'Nothing to sweep.');
    }
    const priv = bsv.PrivateKey.fromWIF(item.wif);
    const built = TxBuilder.send({
      utxos: spendable, toAddress: destAddress, sats: 'max',
      privateKey: priv, fromAddress: item.address,
    });
    return {
      path: item.path, fromAddress: item.address, to: destAddress,
      hex: built.hex, txid: built.txid, sentSats: built.sentSats, fee: built.fee, vsize: built.vsize,
      protectedCount,
    };
  },

  // Broadcast a previously-built sweep draft. Records per-path result so the
  // recovery row updates row-by-row.
  async _broadcastSweepDraft(draft) {
    const session = walletSession;
    try {
      const txidRaw = await Net.woc.broadcast(draft.hex);
      const txid = draft.txid;
      if (!broadcastMatches(txidRaw, txid)) throw new Error(unknownOutcome(txid));
      if (session !== walletSession) {
        Status.info(`A sweep started before the lock was broadcast: ${txid}`);
        return { ok: true, txid };
      }
      const swept = { ...(state.draft && state.draft.swept ? state.draft.swept : {}) };
      swept[draft.path] = { ok: true, txid };
      setState({ draft: { ...state.draft, swept } });
      Status.info(`Swept ${Fmt.sats(draft.sentSats)} sats from ${draft.fromAddress} → ${Fmt.shortHash(draft.to)}: ${txid}`);
      return { ok: true, txid };
    } catch (e) {
      if (session !== walletSession) return { ok: false, error: e.message };
      const prior = state.draft && state.draft.swept && state.draft.swept[draft.path];
      if (prior && prior.ok) {
        // Already swept successfully (for example a re-sent identical
        // transaction the node reports as known): keep the recorded success.
        Status.error(`Sweep broadcast failed, but ${draft.fromAddress} was already swept: ${e.message}`);
        return { ok: true, txid: prior.txid };
      }
      const swept = { ...(state.draft && state.draft.swept ? state.draft.swept : {}) };
      swept[draft.path] = { ok: false, error: e.message };
      setState({ draft: { ...state.draft, swept } });
      Status.error(`Sweep broadcast failed: ${e.message}`);
      return { ok: false, error: e.message };
    }
  },

  // Per-row Sweep button: build, but DO NOT broadcast yet. Stash the draft in
  // state.draft.sweepPreview so the recovery row inline-renders the hex
  // inspector + Confirm/Cancel. User can copy the hex to WhatsOnChain to
  // verify, then click Confirm to actually send.
  async previewSweep(item) {
    if (state.busy) return;
    if (state.draft && state.draft.sweepAllPlan) { Status.error('Cancel the prepared sweep of all addresses first.'); return; }
    Status.clear();
    setState({ busy: true });
    const session = walletSession;
    try {
      const draft = await Actions._buildSweepDraft(item, Actions._recoveryDest());
      if (session !== walletSession) return;   // wallet locked or switched meanwhile
      setState({
        busy: false,
        draft: { ...state.draft, sweepPreview: draft },
      });
      Status.info('Sweep transaction built. Review and confirm to broadcast.');
    } catch (e) {
      if (session !== walletSession) return;
      setState({ busy: false });
      Status.error(e.message);
    }
  },
  cancelSweepPreview() {
    const next = { ...state.draft }; delete next.sweepPreview;
    setState({ draft: next });
    Status.info('Sweep cancelled.');
  },
  async confirmSweepPreview() {
    if (state.busy) return;
    const d = state.draft && state.draft.sweepPreview;
    if (!d) { Status.error('No sweep to confirm.'); return; }
    const dropPreview = () => { const next = { ...state.draft }; delete next.sweepPreview; setState({ draft: next }); };
    // Signed to the destination at preview time; refuse if it has changed since.
    if (d.to !== Actions._recoveryDest()) {
      dropPreview();
      Status.error('The destination changed after this sweep was built. Preview it again.');
      return;
    }
    const done = state.draft.swept && state.draft.swept[d.path];
    if (done && done.ok) { dropPreview(); Status.info('This address was already swept.'); return; }
    setState({ busy: true });
    const session = walletSession;
    try {
      await Actions._broadcastSweepDraft(d);
    } finally {
      if (session === walletSession) {
        const next = { ...state.draft }; delete next.sweepPreview;
        setState({ busy: false, draft: next });
      }
    }
  },

  // Sweep every still-unswept recovery item to the configured destination.
  // Each item is broadcast as its own transaction (one per source address);
  // we don't combine across paths because each has a different private key.
  // Bypasses the per-row preview — the destination was already set explicitly
  // at the top of the panel, and click-through preview for N items would
  // defeat the bulk action. Failures on one item don't block the others.
  // Sweep-all happens in two steps. prepareSweepAll builds and signs a draft for
  // every unswept recovery item but broadcasts nothing; the recovery panel then
  // shows the totals (sent, fees, destination) and confirmSweepAll broadcasts
  // exactly those drafts. A re-scan, a destination change or a lock discards
  // the prepared plan.
  async prepareSweepAll() {
    if (state.busy) return;
    const rec = state.recovery;
    if (!rec || !rec.found || rec.found.length === 0) { Status.error('Nothing to sweep.'); return; }
    const destAddress = Actions._recoveryDest();
    if (!destAddress) { Status.error('No destination — enter or derive an address first.'); return; }
    if (!isValidAddress(destAddress)) { Status.error('Destination must be a mainnet BSV address starting with 1 (P2PKH).'); return; }
    const swept = (state.draft && state.draft.swept) || {};
    const pending = rec.found.filter(it => !(swept[it.path] && swept[it.path].ok));
    if (pending.length === 0) { Status.info('All items already swept.'); return; }

    Status.clear();
    const session = walletSession;
    // Only one sweep path at a time: a prepared plan replaces an open preview.
    const draftNoPreview = { ...state.draft }; delete draftNoPreview.sweepPreview;
    setState({ busy: true, draft: draftNoPreview });
    const drafts = [];
    const errors = [];
    for (const item of pending) {
      try {
        const draft = await Actions._buildSweepDraft(item, destAddress);
        if (session !== walletSession) return;   // locked while building: keep nothing
        drafts.push(draft);
      } catch (e) {
        if (session !== walletSession) return;
        errors.push({ path: item.path, fromAddress: item.address, error: e.message });
      }
    }
    setState({
      busy: false,
      draft: { ...state.draft, sweepAllPlan: { dest: destAddress, drafts, errors } },
    });
    Status.info(drafts.length > 0
      ? `${drafts.length} sweep transaction(s) built and signed. Review the totals, then confirm to broadcast.`
      : 'No sweep could be built. See the reasons listed under the plan.');
  },
  cancelSweepAll() {
    const next = { ...state.draft }; delete next.sweepAllPlan;
    setState({ draft: next });
    Status.info('Sweep-all cancelled. Nothing was broadcast.');
  },
  async confirmSweepAll() {
    if (state.busy) return;
    const plan = state.draft && state.draft.sweepAllPlan;
    if (!plan || plan.drafts.length === 0) { Status.error('Nothing prepared to broadcast.'); return; }
    if (Actions._recoveryDest() !== plan.dest) {
      Status.error('The destination changed after these transactions were built. Prepare the sweep again.');
      return;
    }
    const session = walletSession;
    setState({ busy: true });
    let ok = 0, fail = 0, skipped = 0;
    for (const draft of plan.drafts) {
      if (session !== walletSession) break;
      const done = state.draft && state.draft.swept && state.draft.swept[draft.path];
      if (done && done.ok) { skipped++; continue; }   // swept individually meanwhile
      const r = await Actions._broadcastSweepDraft(draft);
      if (r.ok) ok++; else fail++;
    }
    if (session !== walletSession) {
      Status.info(`Sweep-all stopped because the wallet was locked: ${ok} broadcast, ${fail} failed before that.`);
      return;
    }
    const next = { ...state.draft }; delete next.sweepAllPlan;
    setState({ busy: false, draft: next });
    Status.info(`Sweep-all complete: ${ok} broadcast, ${fail} failed` + (skipped ? `, ${skipped} already swept.` : '.'));
  },

  // ---- export: re-verify password before revealing mnemonic + passphrase
  async exportMnemonic(pw) {
    if (!pw) { Status.error('Enter your password.'); return; }
    setState({ busy: true });
    const session = walletSession;
    try {
      const { mnemonic, passphrase } = await Vault.unlock(pw);   // re-decrypts; throws on wrong pw
      if (session !== walletSession) return;   // locked meanwhile: never reveal into a locked UI
      clearFieldsOnNextRender('export-pw');
      setState({ busy: false, draft: {
        ...state.draft,
        exportedMnemonic: mnemonic,
        exportedPassphrase: passphrase || '',
      }});
      Status.info('Mnemonic revealed. Hide when done.');
    } catch (e) {
      if (session !== walletSession) return;
      setState({ busy: false });
      Status.error(e.message || 'Wrong password.');
    }
  },
  clearExport() {
    const next = { ...state.draft };
    delete next.exportedMnemonic;
    delete next.exportedPassphrase;
    setState({ draft: next });
    Status.clear();
  },
  // Download the existing encrypted vault blob as a JSON file. The file itself
  // is useless without the password; safe to email to yourself, archive, etc.
  downloadEncryptedBackup() {
    const blob = Vault.read();
    if (!blob) { Status.error('No vault to back up.'); return; }
    const data = new Blob([JSON.stringify(blob, null, 2)],
      { type: 'application/json' });
    const url = URL.createObjectURL(data);
    const a = el('a', { href: url, download: `satofinder-vault-${Date.now()}.json` });
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    Status.info('Encrypted backup downloaded.');
  },

  async loadHistory() {
    if (!state.derived) { Status.error('No address derived.'); return; }
    setState({ busy: true });
    const session = walletSession;
    const derived = state.derived;
    try {
      const data = await Net.woc.history(state.derived.address);
      if (!stillCurrent(session, derived)) return;   // wallet locked or switched meanwhile
      if (!Array.isArray(data)) throw new Error('Unexpected history response');
      // Cap render at 100 most recent so the panel doesn't choke on busy
      // addresses; WoC returns oldest-first, so reverse + slice.
      const items = data.slice().reverse().slice(0, 100);
      setState({ history: items, busy: false });
      Status.info(items.length === 0 ? 'No transactions on this address.' : `${items.length} tx loaded.`);
    } catch (e) {
      if (!stillCurrent(session, derived)) return;
      setState({ busy: false });
      Status.error(`History fetch failed: ${e.message}`);
    }
  },

  // ---- tokens & ordinals (informational only — protection is enforced
  // automatically in buildSend / _buildSweepDraft regardless of this load).
  // Soft-fails: if the indexer is down here we surface an error but don't
  // wedge the wallet. The Send/Sweep paths still hard-block when the
  // indexer is down at spend time.
  async loadTokens() {
    if (!state.derived) { Status.error('No address derived.'); return; }
    const addr = state.derived.address;
    setState({ busy: true });
    const session = walletSession;
    const derived = state.derived;
    try {
      const [rawTxos, rawBal] = await Promise.all([
        Net.gorillapool.unspent(addr),
        Net.gorillapool.bsv20Balance(addr).catch(() => []),  // bsv20 endpoint is allowed to noop
      ]);
      if (!stillCurrent(session, derived)) return;   // wallet locked or switched meanwhile
      if (!Array.isArray(rawTxos)) throw new Error('Indexer returned unexpected shape.');
      const ordinals = rawTxos.filter(Tokens.isProtected).map(Tokens.describeOrdinal);
      // Normalize BSV-20 balance shape: array of { sym, dec, id, all: { confirmed }}
      const bsv20 = (Array.isArray(rawBal) ? rawBal : []).map(b => {
        const dec = Number(b.dec) || 0;
        const rawC = (b.all && (b.all.confirmed || b.all.pending)) || '0';
        const big = BigInt(rawC);
        const denom = BigInt(10) ** BigInt(dec || 0);
        const intPart = dec ? (big / denom).toString() : big.toString();
        const fracPart = dec ? (big % denom).toString().padStart(dec, '0').replace(/0+$/, '') : '';
        return {
          sym: String(b.sym || ''), id: String(b.id || ''), dec,
          amountRaw: rawC,
          amountStr: dec && fracPart ? `${intPart}.${fracPart}` : intPart,
        };
      });
      setState({ busy: false, tokens: { address: addr, ordinals, bsv20 } });
      const parts = [];
      if (ordinals.length) parts.push(`${ordinals.length} ordinal${ordinals.length === 1 ? '' : 's'}`);
      if (bsv20.length)    parts.push(`${bsv20.length} BSV-20 token${bsv20.length === 1 ? '' : 's'}`);
      Status.info(parts.length ? `Found ${parts.join(' + ')} at this address.` : 'No ordinals or BSV-20 tokens at this address.');
    } catch (e) {
      if (!stillCurrent(session, derived)) return;
      setState({ busy: false });
      Status.error(`Token lookup failed: ${e.message}`);
    }
  },
};

// Wallet: thin shell over the SDK, returned by Vault.unlock or setPassword.
// Stays in RAM only; never persisted. The BIP39 passphrase is part of the
// seed material; pass '' for no passphrase (the BIP39 default — same as
// other-wallet "I never set one").
const Wallet = {
  openFromMnemonic(phrase, passphrase = '') {
    const m = bsv.Mnemonic.fromString(phrase);
    const seed = m.toSeed(passphrase || '');   // BIP39 spec: empty -> salt is just "mnemonic"
    const root = bsv.HDPrivateKey.fromSeed(seed);
    return { mnemonic: phrase, passphrase: passphrase || '', root };
  },
};

// Auto-lock: clear the in-RAM wallet after AUTOLOCK_MS of inactivity (or when
// the tab becomes hidden, which is more aggressive). User can opt out by
// staying interactive.
// Clears a copied secret from the clipboard. A page can't read the clipboard
// without a permission prompt, so the clear is unconditional: it overwrites
// the clipboard with an empty string. Writing needs the page focused, so an
// attempt made while it isn't is retried the next time it gains focus.
const ClipboardGuard = {
  _timer: null,
  _due: false,
  schedule() {
    ClipboardGuard.cancel();
    ClipboardGuard._timer = setTimeout(() => { ClipboardGuard._timer = null; ClipboardGuard.clearNow(); }, CLIPBOARD_CLEAR_MS);
  },
  cancel() {
    if (ClipboardGuard._timer) { clearTimeout(ClipboardGuard._timer); ClipboardGuard._timer = null; }
    ClipboardGuard._due = false;
  },
  pending() { return !!ClipboardGuard._timer || ClipboardGuard._due; },
  _clearing: null,
  // Concurrent callers (a focus event and a lock together) share one write.
  clearNow() {
    if (ClipboardGuard._timer) { clearTimeout(ClipboardGuard._timer); ClipboardGuard._timer = null; }
    if (!ClipboardGuard._clearing) {
      ClipboardGuard._clearing = (async () => {
        try {
          await navigator.clipboard.writeText('');
          ClipboardGuard._due = false;
        } catch {
          ClipboardGuard._due = true;   // not focused: try again on focus
        } finally {
          ClipboardGuard._clearing = null;
        }
      })();
    }
    return ClipboardGuard._clearing;
  },
  onFocus() { if (ClipboardGuard._due) ClipboardGuard.clearNow(); },
};

// Timers are the fast path; wall-clock times are the backstop. Browsers can
// freeze a background tab's timers (memory saver, mobile) or pause them in
// sleep, so every return to the page and every activity event re-checks the
// elapsed time and locks if a limit has passed.
const AutoLock = {
  _timer: null,
  _hidden: null,
  _hiddenAt: null,     // when the tab was hidden, while it is hidden
  _lastActive: 0,      // last activity (or unlock) that re-armed the idle timer
  arm() {
    // Resets only the idle timer: a pending hidden-tab lock must survive it.
    AutoLock._lastActive = Date.now();
    if (AutoLock._timer) clearTimeout(AutoLock._timer);
    AutoLock._timer = setTimeout(() => {
      if (!state.locked) Actions.lock();
    }, AUTOLOCK_MS);
  },
  disarm() {
    if (AutoLock._timer) { clearTimeout(AutoLock._timer); AutoLock._timer = null; }
    if (AutoLock._hidden) { clearTimeout(AutoLock._hidden); AutoLock._hidden = null; }
    AutoLock._hiddenAt = null;
  },
  // Call after any successful unlock: arms the idle timer and, if the tab is
  // already hidden (e.g. switched away during a slow unlock), starts the grace.
  start() {
    AutoLock.arm();
    if (document.visibilityState === 'hidden') AutoLock.onHidden();
  },
  idleExpired() { return Date.now() - AutoLock._lastActive >= AUTOLOCK_MS; },
  // Returns true when this call locked the wallet.
  bump() {
    if (state.locked) return false;
    if (AutoLock.idleExpired()) { Actions.lock(); return true; }   // timer missed (sleep/freeze)
    AutoLock.arm();
    return false;
  },
  // Tab hidden: lock once the grace period passes, unless it comes back first.
  onHidden() {
    if (state.locked) return;
    if (AutoLock._hiddenAt === null) AutoLock._hiddenAt = Date.now();
    if (AutoLock._hidden) return;
    AutoLock._hidden = setTimeout(() => {
      AutoLock._hidden = null;
      if (!state.locked) Actions.lock();
    }, HIDDEN_GRACE_MS);
  },
  onVisible() {
    const hiddenFor = AutoLock._hiddenAt === null ? 0 : Date.now() - AutoLock._hiddenAt;
    AutoLock._hiddenAt = null;
    if (AutoLock._hidden) { clearTimeout(AutoLock._hidden); AutoLock._hidden = null; }
    if (state.locked) return;
    if (hiddenFor >= HIDDEN_GRACE_MS || AutoLock.idleExpired()) { Actions.lock(); return; }
    AutoLock.arm();
  },
};

function wireGlobalEvents() {
  // Reset idle timer on any interaction.
  // A secret clear that couldn't run while the page was unfocused runs now.
  window.addEventListener('focus', ClipboardGuard.onFocus);
  // Capture phase, so an expired idle locks first, and the event that found
  // it expired never reaches its target.
  for (const ev of ['mousemove','keydown','touchstart','focus','click']) {
    window.addEventListener(ev, (e) => { if (AutoLock.bump()) e.stopPropagation(); }, { passive: true, capture: true });
  }
  // A hidden tab locks after HIDDEN_GRACE_MS, sooner than the idle timeout.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') AutoLock.onHidden();
    else AutoLock.onVisible();
  });
}

// ====================== 10. BOOT ======================
function boot() {
  // Sanity: required SDK globals must be present after SRI-pinned CDN loads.
  const missing = ['bsv'].filter(g => typeof window[g] === 'undefined');
  if (missing.length) {
    Status.error(`SDK not loaded: ${missing.join(', ')} — check CDN/SRI integrity.`);
    return;
  }
  if (typeof bsv.Mnemonic !== 'function') {
    Status.error('bsv.Mnemonic missing — the bsv bundle failed SRI or did not load.');
  }
  subscribe(renderApp);
  subscribe(renderStatusBar);
  const prefs = Prefs.load();
  setState({
    vaultExists: Vault.exists(),
    view: 'landing',
    locked: true,
    bip:      typeof prefs.bip       === 'number' ? prefs.bip       : 44,
    coin:     typeof prefs.coin      === 'number' ? prefs.coin      : 0,
    account:  typeof prefs.account   === 'number' ? prefs.account   : 0,
    change:   typeof prefs.change    === 'number' ? prefs.change    : 0,
    addrIndex: typeof prefs.addrIndex === 'number' ? prefs.addrIndex : 0,
    preset:   typeof prefs.preset    === 'string' ? prefs.preset    : 'default',
    hideKeys: typeof prefs.hideKeys  === 'boolean' ? prefs.hideKeys : true,
    // A stored fee is user input that has been round-tripped through
    // localStorage — re-validate it rather than trust it back.
    feePerKb: sanitizeFeePerKb(prefs.feePerKb, DEFAULT_FEE_PER_KB),
  });
  wireGlobalEvents();
  // Fetch BSV price once at boot; non-fatal if it fails.
  Actions.fetchPrice();
  // No service worker is registered. The old one served the app cache-first and
  // only refreshed when its own file changed, which pinned returning users to
  // v2.0.0 across four releases — including the release that stops a Send from
  // burning an ordinal. It bought nothing in return: this wallet needs the
  // network for every useful action, and SRI already guarantees the bundle's
  // bytes. ./service-worker.js is now a tombstone that unregisters any worker a
  // previous visit installed; see the long comment there before reinstating one.
  console.info(`SatoFinder ${VERSION} booted`);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot, { once: true });
} else {
  boot();
}
